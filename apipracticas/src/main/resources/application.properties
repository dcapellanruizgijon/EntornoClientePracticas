# Production properties (use environment variables in Render)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# In production validate the schema; do NOT use create/update in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server port (Render sets PORT env var)
server.port=${PORT:8080}

# Optional: disable default template check if not using Thymeleaf templates
spring.thymeleaf.check-template-location=false
